<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Builder Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --paper: #EEF1EF;
    --surface: #FFFFFF;
    --sunk: #E3E8E5;
    --ink: #14213D;
    --muted: #586374;
    --line: #CBD3CF;
    --act: #14213D;
    --act-ink: #FFFFFF;
    --blaze-red: #C4122F;
    --blaze-white: #FFFFFF;
    --ok: #17784A;
    --ok-soft: #DDF0E4;
    --no: #A3361F;
    --no-soft: #F8E3DC;
    --focus: #2357D9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0F141C; --surface: #171E29; --sunk: #1E2733; --ink: #E7ECF2; --muted: #9BA6B6; --line: #2C3747;
      --act: #E7ECF2; --act-ink: #0F141C; --blaze-red: #E5485F; --blaze-white: #E7ECF2;
      --ok: #4CC28C; --ok-soft: #14301F; --no: #F08A6F; --no-soft: #3A2019; --focus: #8FA9FF; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0F141C; --surface: #171E29; --sunk: #1E2733; --ink: #E7ECF2; --muted: #9BA6B6; --line: #2C3747;
    --act: #E7ECF2; --act-ink: #0F141C; --blaze-red: #E5485F; --blaze-white: #E7ECF2;
    --ok: #4CC28C; --ok-soft: #14301F; --no: #F08A6F; --no-soft: #3A2019; --focus: #8FA9FF; color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; font-size: 17px; line-height: 1.55; }
  a { color: inherit; text-underline-offset: 3px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 20; }
  .skip:focus { left: 8px; }
  button, select, textarea, input { font: inherit; color: inherit; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); padding: 10px 18px; border-radius: 999px; font-weight: 700; line-height: 1.2; text-decoration: none; }
  .btn:hover { background: var(--sunk); }
  .btn.main { background: var(--act); border-color: var(--act); color: var(--act-ink); }
  .btn.main:hover { filter: brightness(1.15); }
  .btn.link { border-color: transparent; padding-left: 2px; padding-right: 2px; text-decoration: underline; font-weight: 400; }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }

  /* Header */
  header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
  .bar { max-width: 1120px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .bar h1 { margin: 0; font-size: 20px; }
  .bar h1 a { text-decoration: none; }
  .bar .sub { color: var(--muted); font-size: 15px; }
  .chrono { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .chrono .live { font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .chrono .live::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--blaze-red); }

  /* Layout */
  .layout { max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; display: grid; gap: 32px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .layout { grid-template-columns: 270px minmax(0, 1fr); } aside.side { position: sticky; top: 20px; align-self: start; } }
  main { min-width: 0; max-width: 740px; }
  @media (max-width: 899px) { aside.side { order: 2; border-top: 1px solid var(--line); padding-top: 24px; } .bar .sub { display: none; } .next .what { font-size: 23px; } .next { padding: 20px; } }
  main:focus { outline: none; }

  /* The trail */
  .homelink { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; font-weight: 700; margin-bottom: 14px; }
  .homelink[aria-current="page"], .homelink:hover { background: var(--sunk); }
  ol.trail { list-style: none; margin: 0; padding: 0; position: relative; }
  ol.trail::before { content: ""; position: absolute; left: 21px; top: 16px; bottom: 16px; border-left: 2px dashed var(--line); }
  .stage > a { position: relative; display: flex; gap: 14px; align-items: flex-start; padding: 9px 10px; border-radius: 8px; text-decoration: none; }
  .stage > a:hover, .stage > a[aria-current="page"] { background: var(--sunk); }
  .blaze { flex: none; width: 24px; height: 16px; margin-top: 4px; border-radius: 2px; background: linear-gradient(var(--blaze-white) 0 50%, var(--blaze-red) 50% 100%); box-shadow: 0 0 0 1.5px var(--ink); position: relative; z-index: 1; }
  .stage.todo .blaze { opacity: .45; }
  .stage.locked .blaze { background: var(--sunk); box-shadow: 0 0 0 1.5px var(--line); }
  .stage .t { display: flex; flex-direction: column; line-height: 1.3; }
  .stage .t small { color: var(--muted); font-size: 14px; }
  .stage.locked .t { color: var(--muted); }
  ul.substeps { list-style: none; margin: 2px 0 10px 48px; padding: 0; font-size: 15px; }
  ul.substeps a { display: flex; justify-content: space-between; gap: 10px; padding: 5px 10px; border-radius: 6px; text-decoration: none; }
  ul.substeps a:hover, ul.substeps a[aria-current="page"] { background: var(--sunk); }
  ul.substeps a[aria-current="page"] { font-weight: 700; }
  ul.substeps span { color: var(--muted); }

  /* Content blocks */
  .block { padding: 26px 0; border-top: 1px solid var(--line); }
  .block:first-child { border-top: 0; padding-top: 0; }
  h2 { font-size: 24px; line-height: 1.25; margin: 0 0 10px; }
  h3 { font-size: 18px; margin: 18px 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 15px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  .next { background: var(--surface); border: 1.5px solid var(--ink); border-radius: 14px; padding: 24px; }
  .next .what { font-size: 28px; line-height: 1.2; font-weight: 700; margin: 4px 0 8px; max-width: 30ch; }
  .next .where { color: var(--muted); margin-bottom: 18px; }

  .meter { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin: 8px 0; }
  .meter > span { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
  .meter.ok > span { background: var(--ok); }
  .bigfig { font-size: 48px; font-weight: 700; line-height: 1; }

  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
  ul.plain li:last-child { border-bottom: 0; }
  .tag { font-size: 14px; padding: 2px 10px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); font-weight: 700; }

  ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: start; padding: 16px 0; border-bottom: 1px solid var(--line); }
  ol.steps li::before { content: counter(s); width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font-weight: 700; }
  ol.steps li.done::before { content: "✓"; background: var(--ok); border-color: var(--ok); color: #fff; }
  ol.steps .d { color: var(--muted); font-size: 15px; margin: 2px 0 0; }

  /* Lesson reader */
  .pager { display: flex; gap: 6px; margin: 4px 0 18px; }
  .pager span { flex: 1; height: 6px; border-radius: 99px; background: var(--sunk); }
  .pager span.read { background: var(--ok); }
  .pager span.here { background: var(--ink); }
  article.lesson { background: var(--surface); border-radius: 14px; padding: 28px; border: 1px solid var(--line); }
  article.lesson p { max-width: 64ch; }
  .sources { font-size: 15px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 16px; }
  .sources a { display: block; color: var(--ink); }

  /* Quiz */
  fieldset.q { border: 0; padding: 0; margin: 0; }
  fieldset.q legend { font-size: 22px; font-weight: 700; line-height: 1.3; margin-bottom: 14px; padding: 0; }
  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; margin-bottom: 10px; cursor: pointer; background: var(--surface); }
  .opt:hover { border-color: var(--ink); }
  .opt input { margin-top: 5px; accent-color: var(--ink); }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--no); background: var(--no-soft); }
  .feedback { border-left: 4px solid var(--ok); padding: 10px 14px; margin: 14px 0; background: var(--surface); }
  .feedback.bad { border-left-color: var(--no); }

  /* Exercises & notebook */
  .ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .ex.validated { border-color: var(--ok); }
  .ex h3 { margin: 0; }
  .ex .meta { color: var(--muted); font-size: 15px; margin: 2px 0 10px; }
  .ex .crit label { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; }
  .ex input[type=checkbox] { margin-top: 6px; accent-color: var(--ok); width: 18px; height: 18px; }
  .field { display: block; width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
  .field:focus { border-color: var(--ink); }
  textarea.field { min-height: 110px; resize: vertical; }
  .err { color: var(--no); font-size: 15px; margin: 6px 0 0; min-height: 1em; }
  .locknote { padding: 18px; border: 1.5px dashed var(--line); border-radius: 12px; }

  .homelink.sub2 { margin-top: -10px; }
  .tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .toolcard { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; text-decoration: none; }
  .toolcard:hover { border-color: var(--ink); }
  .toolcard strong { font-size: 19px; display: block; }
  .toolcard .c { color: var(--muted); font-size: 14px; display: block; margin-bottom: 6px; }
  .toolcard .w { font-size: 15px; display: block; }
  .usecase { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; }
  .usecase h4 { margin: 0 0 6px; font-size: 18px; }
  .usecase p { margin: 0; }
  ol.flow { list-style: none; padding: 0; margin: 4px 0 12px; display: flex; flex-wrap: wrap; gap: 6px 0; align-items: center; }
  ol.flow li { display: flex; align-items: center; font-size: 15px; }
  ol.flow li span { background: var(--sunk); border-radius: 8px; padding: 4px 10px; }
  ol.flow li:not(:last-child)::after { content: "→"; margin: 0 8px; color: var(--muted); }
  .try { border-left: 4px solid var(--blaze-red); background: var(--surface); padding: 14px 18px; border-radius: 0 12px 12px 0; }
  .pair { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 640px) { .pair { grid-template-columns: 1fr 1fr; } }
  .try code { display: block; margin: 8px 0; padding: 8px 10px; background: var(--sunk); border-radius: 6px; font-size: 14px; overflow-x: auto; white-space: pre; }
  .toolsline { font-size: 15px; color: var(--muted); margin-top: 10px; }
  .toolsline a { color: var(--ink); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>
<header class="top">
  <div class="bar">
    <h1><a href="#accueil">Builder Path</a></h1>
    <span class="sub">Votre parcours en autonomie vers le métier de product builder IA</span>
    <div class="chrono" id="chrono"></div>
  </div>
</header>
<div class="layout">
  <aside class="side"><nav aria-label="Le parcours" id="trail"></nav></aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const MODULES = [
  {
    id: 1, slug: "module-1", title: "Agents, workflows et RAG", hours: "6 à 8 h",
    goal: "Comprendre quand un workflow suffit, quand un agent se justifie, et comment brancher un modèle sur vos propres données.",
    lessons: [
      { id: "l1-1", title: "Workflow ou agent : choisir le motif le plus simple",
        body: ["Un workflow suit un chemin défini à l’avance : déclencheur, traitements, action. Un agent confie au modèle le choix des étapes et des outils à appeler. Le second est plus souple, plus cher et plus difficile à évaluer.",
               "La règle que donne Anthropic dans son guide sur les agents : commencer par le motif le plus simple qui résout le problème (un appel bien formulé, puis une chaîne, puis un routage) et n’ajouter de l’autonomie que lorsque la mesure le justifie."],
        sources: [["Anthropic, Building effective agents","https://www.anthropic.com/engineering/building-effective-agents"],["Documentation n8n","https://docs.n8n.io/"]] },
      { id: "l1-2", title: "n8n en pratique : déclencheur, nœuds, agent",
        body: ["n8n est un outil d’automatisation open source que l’on peut héberger soi-même en Docker. Un workflow commence par un nœud déclencheur (webhook, formulaire, planning), enchaîne des nœuds de traitement et finit par une action (envoi, écriture en base, réponse HTTP).",
               "Le nœud AI Agent ajoute un modèle de langage qui peut appeler des outils (recherche, base de données, API). C’est la brique du jour 1 du programme Le Wagon."],
        sources: [["freeCodeCamp, cours n8n","https://www.freecodecamp.org/news/learn-n8n-to-design-develop-and-deploy-production-grade-ai-agents/"],["Documentation n8n","https://docs.n8n.io/"]] },
      { id: "l1-3", title: "RAG : embeddings, découpage, récupération",
        body: ["Un RAG (retrieval-augmented generation) répond à partir de vos documents : chaque extrait est transformé en vecteur (embedding), stocké dans une base vectorielle comme Postgres avec pgvector, puis les extraits les plus proches de la question sont injectés dans le prompt.",
               "La qualité dépend d’abord de la récupération : un mauvais découpage ou une mauvaise recherche produit une réponse fausse, même avec le meilleur modèle. On évalue donc la récupération séparément de la génération."],
        sources: [["DeepLearning.AI, Building Applications with Vector Databases","https://www.deeplearning.ai/short-courses/building-applications-vector-databases"],["Documentation Supabase","https://supabase.com/docs"]] },
      { id: "l1-4", title: "Évaluer avant de livrer",
        body: ["Les evals sont l’infrastructure de base d’un produit IA. Un eval de capacité mesure ce que le système sait faire ; un eval de régression vérifie qu’un changement ne casse pas ce qui marchait.",
               "Un premier jeu de 50 à 100 cas réalistes, notés par un humain puis par un modèle juge calibré sur ces notes, suffit à piloter les itérations. Sans eval, l’équipe découvre les régressions en production."],
        sources: [["Anthropic, Demystifying evals for AI agents","https://anthropic.com/engineering/demystifying-evals-for-ai-agents"],["Anthropic, Develop test cases","https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"]] }
    ],
    quiz: [
      { q: "Quelle est la différence principale entre un workflow et un agent ?", a: ["Un workflow utilise un modèle de langage, pas l’agent","L’agent décide des étapes avec un modèle, le workflow suit un chemin prédéfini","L’agent est toujours plus fiable","Il n’y en a pas, ce sont des synonymes"], ok: 1, exp: "Dans un agent, le modèle choisit les étapes et les outils ; dans un workflow, le chemin est écrit à l’avance. C’est ce qui rend l’agent plus souple et plus difficile à évaluer." },
      { q: "Que recommande Anthropic pour démarrer un produit IA ?", a: ["Un agent multi-outils dès le départ","Le motif le plus simple qui résout le problème","Un fine-tuning du modèle","Une orchestration multi-agents"], ok: 1, exp: "Commencer simple, mesurer, puis ajouter de l’autonomie seulement si la mesure le justifie." },
      { q: "Dans un RAG, à quoi sert l’embedding ?", a: ["À compresser le texte","À transformer un texte en vecteur pour la recherche sémantique","À traduire le texte","À chiffrer les documents"], ok: 1, exp: "L’embedding représente le sens d’un extrait sous forme de vecteur ; la recherche compare les vecteurs entre eux." },
      { q: "pgvector, c’est :", a: ["Un modèle de langage","Une extension Postgres pour stocker et comparer des vecteurs","Un nœud n8n","Un format de fichier"], ok: 1, exp: "pgvector ajoute à Postgres un type vecteur et des index de similarité ; Supabase l’active en un clic." },
      { q: "La réponse de votre RAG est fausse. Que vérifier en premier ?", a: ["La température du modèle","Les extraits récupérés avant génération","Le style du prompt","La clé d’API"], ok: 1, exp: "Si la récupération ramène les mauvais extraits, aucun réglage du modèle ne corrigera la réponse." },
      { q: "Un eval de régression sert à :", a: ["Mesurer de nouvelles capacités","Vérifier qu’un changement ne dégrade pas ce qui fonctionnait","Entraîner le modèle","Estimer le coût par requête"], ok: 1, exp: "Il se joue à chaque modification de prompt, de modèle ou de données, comme une suite de tests." },
      { q: "Taille raisonnable d’un premier jeu de test :", a: ["3 cas","50 à 100 cas réalistes","10 000 cas","Aucun, on observe la production"], ok: 1, exp: "Assez pour couvrir les cas courants et les cas limites, assez petit pour être relu par un humain." },
      { q: "Dans n8n, un nœud déclencheur (trigger) :", a: ["Exécute le modèle","Démarre le workflow sur un événement","Stocke les données","Envoie un courriel"], ok: 1, exp: "Webhook, formulaire, planning ou événement d’une application : c’est toujours le point d’entrée du workflow." }
    ],
    exercises: [
      { id: "e1-1", title: "Installer n8n en Docker et livrer un premier workflow", tool: "n8n", time: "2 h",
        brief: "Lancez n8n en local, puis construisez : formulaire → appel à un modèle → réponse affichée ou envoyée.",
        criteria: ["n8n tourne en local (Docker) et le workflow est sauvegardé","Le workflow s’exécute de bout en bout sur une saisie réelle","Le prompt impose un format de réponse (JSON ou structure fixe)"], proof: "Lien vers le workflow exporté (JSON) ou capture de l’exécution" },
      { id: "e1-2", title: "Recherche sémantique sur vos propres documents", tool: "Supabase + pgvector", time: "2 h",
        brief: "Créez une table avec pgvector, insérez une vingtaine d’extraits (par exemple des critères RGAA) et retrouvez les trois plus proches d’une question.",
        criteria: ["Extension pgvector activée et table créée","20 extraits insérés avec leur embedding","Une requête de similarité retourne les 3 extraits attendus"], proof: "Lien vers le script SQL ou capture des résultats" },
      { id: "e1-3", title: "Votre premier jeu d’evals", tool: "Tableur ou fichier JSON", time: "1 h 30",
        brief: "Écrivez 20 cas (question, réponse attendue, critère de réussite) pour l’assistant de l’exercice 1 et notez son taux de réussite.",
        criteria: ["20 cas dont au moins 5 cas limites","Un critère de réussite observable par cas","Taux de réussite calculé et commenté en 3 lignes"], proof: "Lien vers le fichier des cas" }
    ]
  },
  {
    id: 2, slug: "module-2", title: "Backend et application utilisateur", hours: "5 à 7 h",
    goal: "Donner un backend à votre workflow et l’exposer à un utilisateur non technique, sans exposer vos clés.",
    lessons: [
      { id: "l2-1", title: "Supabase en quatre briques",
        body: ["Supabase fournit sur un projet Postgres : l’authentification, la base avec son API générée, le stockage de fichiers et les edge functions (code serveur proche de la base).",
               "La sécurité repose sur les politiques RLS (row level security) : chaque table dit qui peut lire et écrire quelles lignes. Sans RLS, la clé publique du front donne accès à tout."],
        sources: [["Documentation Supabase","https://supabase.com/docs"]] },
      { id: "l2-2", title: "Exposer un workflow à un utilisateur",
        body: ["Un workflow n8n s’expose par un webhook ; une interface (page vibecodée, bloc WordPress ou app builder comme Softr) appelle ce webhook et affiche la réponse.",
               "Le test d’un bon produit builder : une personne sans compétence technique peut utiliser l’assistant sans explication."],
        sources: [["Documentation n8n","https://docs.n8n.io/"],["Le Wagon, programme AI Product Builder","https://blog.lewagon.com/news/ai-product-builder/"]] },
      { id: "l2-3", title: "Clés, secrets et edge functions",
        body: ["La clé anonyme de Supabase peut vivre dans le front ; la clé service et toute clé d’API de modèle ne doivent jamais y être. Les appels à un modèle passent par une edge function qui garde la clé côté serveur.",
               "Même règle pour les coûts : la fonction serveur impose un plafond par utilisateur et journalise les appels."],
        sources: [["Documentation Supabase","https://supabase.com/docs"]] }
    ],
    quiz: [
      { q: "À quoi servent les politiques RLS dans Supabase ?", a: ["À accélérer les requêtes","À définir qui peut lire et écrire quelles lignes d’une table","À chiffrer la base","À générer l’API"], ok: 1, exp: "RLS est le mécanisme de sécurité des données ; sans politiques, la clé publique du front lit toute la table." },

const EX_TOOLS = { "e1-1": ["n8n"], "e1-2": ["supabase"], "e1-3": ["claude-api"], "e2-1": ["supabase"], "e2-2": ["n8n", "supabase"], "e3-1": ["lovable", "claude-code"], "e3-2": ["mcp", "cursor", "claude-code"], "e4-1": ["notion-jira"], "e4-2": ["mixpanel"], "e5-1": ["claude-code", "supabase", "mixpanel"] };
const LESSON_TOOLS = { "l1-1": ["n8n", "claude-api"], "l1-2": ["n8n", "make-zapier"], "l1-3": ["supabase"], "l1-4": ["claude-api"], "l2-1": ["supabase"], "l2-2": ["n8n", "lovable"], "l2-3": ["supabase", "claude-api"], "l3-1": ["lovable"], "l3-2": ["lovable", "cursor", "claude-code"], "l3-3": ["mcp"], "l4-1": ["notion-jira", "claude-api"], "l4-2": ["mixpanel"], "l4-3": ["claude-api"] };
const tool = s => TOOLS.find(t => t.slug === s);
const toolLinks = slugs => (slugs || []).map(s => `<a href="#outil-${s}">${esc(tool(s).name)}</a>`).join(", ");

const PASS = 80;
const KEY = "builder-path-v1";
let state = {};
let dbDoc = null, saveTimer = null;

function norm() {
  const d = { lessons: {}, quiz: {}, exercises: {}, unlocked: {}, notes: {}, sessions: [], session: null, goalH: 8, ui: { lesson: {} }, last: null };
  for (const k in d) if (state[k] === undefined || state[k] === null && k !== "session" && k !== "last") state[k] = d[k];
  if (!state.ui.lesson) state.ui.lesson = {};
}
function loadLocal() { try { const raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw); } catch (e) {} norm(); }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function persist(touch = true) {
  if (touch) state.last = new Date().toISOString();
  saveLocal();
  if (dbDoc) { clearTimeout(saveTimer); saveTimer = setTimeout(() => { dbDoc.set(JSON.parse(JSON.stringify(state))).catch(() => {}); }, 700); }
}
async function connectDb() {
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    dbDoc = db.doc("data/users/" + (await user.id()) + "/progress");
    const snap = await dbDoc.get();
    if (snap.exists) { state = snap.data(); norm(); saveLocal(); render(); }
    else if (state.last) dbDoc.set(JSON.parse(JSON.stringify(state))).catch(() => {});
  } catch (e) {}
}

/* ---------- Calculs ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const best = m => (state.quiz[m.id] && state.quiz[m.id].best) || 0;
const passed = m => best(m) >= PASS;
const exState = e => state.exercises[e.id] || (state.exercises[e.id] = { criteria: [], proof: "", status: "todo" });
const isValid = e => (state.exercises[e.id] || {}).status === "validated";
const validatedCount = m => m.exercises.filter(isValid).length;
const lessonsRead = m => m.lessons.filter(l => state.lessons[l.id]).length;
const noteDone = m => { const n = state.notes[m.id] || {}; return ["got", "stuck", "change"].every(k => (n[k] || "").trim()); };
const isUnlocked = m => m.id === 1 || state.unlocked[m.id] || passed(MODULES[m.id - 2]);
const isDone = m => passed(m) && validatedCount(m) === m.exercises.length;
const total = MODULES.reduce((n, m) => n + m.exercises.length, 0);
const built = () => MODULES.reduce((n, m) => n + validatedCount(m), 0);
const fmtMin = n => n < 60 ? n + " min" : Math.floor(n / 60) + " h " + String(n % 60).padStart(2, "0");
function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
const weekMin = () => state.sessions.filter(s => new Date(s.start) >= weekStart()).reduce((a, s) => a + s.min, 0);
const elapsed = () => state.session ? Math.max(0, Math.round((Date.now() - new Date(state.session.start)) / 60000)) : 0;

function nextAction() {
  for (const m of MODULES) {
    if (!isUnlocked(m)) continue;
    const i = m.lessons.findIndex(l => !state.lessons[l.id]);
    if (i >= 0) return { m, what: "Lire la fiche « " + m.lessons[i].title + " »", time: "15 min", href: "#" + m.slug + "-fiches", lesson: i };
    if (!passed(m)) return { m, what: "Réussir le quiz du module", time: m.quiz.length * 2 + " min", href: "#" + m.slug + "-quiz" };
    const e = m.exercises.find(x => !isValid(x));
    if (e) return { m, what: e.title, time: e.time, href: "#" + m.slug + "-exercices" };
    if (!noteDone(m)) return { m, what: "Écrire la rétro du module dans votre carnet", time: "10 min", href: "#" + m.slug + "-carnet" };
  }
  return null;
}

/* ---------- Routage ---------- */
const VIEWS = ["fiches", "quiz", "exercices", "carnet"];
function parse() {
  const h = (location.hash || "#accueil").slice(1);
  for (const m of MODULES) {
    if (h === m.slug) return { m, view: "apercu", key: h };
    for (const v of VIEWS) if (h === m.slug + "-" + v) return { m, view: v, key: h };
  }
  if (h === "outils") return { m: null, view: "outils", key: h };
  if (h.startsWith("outil-") && tool(h.slice(6))) return { m: null, view: "outil", tool: tool(h.slice(6)), key: h };
  return { m: null, view: "accueil", key: "accueil" };
}
const steps = m => [
  { v: "fiches", name: "Fiches", status: lessonsRead(m) + "/" + m.lessons.length, done: lessonsRead(m) === m.lessons.length, d: m.lessons.length + " fiches courtes avec leurs sources" },

  { v: "carnet", name: "Carnet", status: noteDone(m) ? "écrit" : "à écrire", done: noteDone(m), d: "Trois questions pour faire le point seul" }
];

    const good = a === item.ok;
    return `<section class="block">
      <p class="muted small">Question ${run.i + 1} sur ${m.quiz.length}</p>
      <div class="pager" aria-hidden="true">${m.quiz.map((x, k) => `<span class="${k === run.i ? "here" : k < run.i ? (run.answers[k] === m.quiz[k].ok ? "read" : "") : ""}"></span>`).join("")}</div>
      <fieldset class="q"><legend>${esc(item.q)}</legend>${opts}</fieldset>
      <div role="status">${run.checked ? `<div class="feedback ${good ? "" : "bad"}"><strong>${good ? "Juste." : "Pas tout à fait."}</strong> ${esc(item.exp)}</div>` : ""}</div>
      <p class="err" id="qerr"></p>
      <div class="row">${run.checked
        ? `<button class="btn main" data-act="q-next" data-m="${m.id}">${last ? "Voir mon score" : "Question suivante"}</button>`
        : `<button class="btn main" data-act="q-check" data-m="${m.id}">Vérifier</button>`}
        <button class="btn link" data-act="q-quit" data-m="${m.id}">Arrêter le quiz</button></div></section>`;
  }
  if (q.lastAnswers) {
    const ok = m.quiz.filter((it, i) => q.lastAnswers[i] === it.ok).length, score = Math.round(ok / m.quiz.length * 100);
    const missed = m.quiz.map((it, i) => ({ it, i })).filter(x => q.lastAnswers[x.i] !== x.it.ok);
    return `<section class="block"><h2>Quiz : ${esc(m.title)}</h2>
      <p><span class="bigfig">${score} %</span> <span class="muted">${ok} sur ${m.quiz.length} au dernier essai</span></p>
      <p>${q.first != null && q.attempts > 1 ? `Premier essai ${q.first} %, meilleur score ${q.best} %, ${q.attempts} essais.` : `Meilleur score ${q.best} %.`}
      ${q.best >= PASS ? ` <span class="tag ok">Étape suivante ouverte</span>` : ` Il faut ${PASS} % pour ouvrir l’étape suivante.`}</p>
      ${missed.length ? `<h3>À revoir</h3><ul class="plain">${missed.map(x => `<li><span><strong>${esc(x.it.q)}</strong><br>${esc(x.it.a[x.it.ok])}<br><span class="small muted">${esc(x.it.exp)}</span></span></li>`).join("")}</ul>` : `<p>Aucune erreur.</p>`}
      <div class="row" style="margin-top:16px"><button class="btn ${q.best >= PASS ? "" : "main"}" data-act="q-start" data-m="${m.id}">Refaire le quiz</button>${q.best >= PASS ? `<a class="btn main" href="#${m.slug}-exercices">Passer aux exercices</a>` : `<a class="btn" href="#${m.slug}-fiches">Relire les fiches</a>`}</div></section>`;
  }
  return `<section class="block"><h2>Quiz : ${esc(m.title)}</h2>
    <p>${m.quiz.length} questions, une à la fois, avec l’explication juste après votre réponse. Comptez ${m.quiz.length * 2} minutes.</p>
    <p class="muted">Votre premier essai est gardé comme point de départ ; seul le meilleur score compte pour avancer.</p>
    <button class="btn main" data-act="q-start" data-m="${m.id}">Commencer</button></section>`;
}

function viewExercises(m) {
  return `<section class="block"><h2>Exercices : ${esc(m.title)}</h2><p class="muted">Un exercice se valide quand tous ses critères sont cochés et qu’une preuve est déposée. C’est cette liste que vous montrerez.</p></section>` +
  m.exercises.map(e => {
    const s = exState(e), v = s.status === "validated";
    return `<article class="ex ${v ? "validated" : ""}" aria-labelledby="h-${e.id}">
      <div class="row"><h3 id="h-${e.id}">${esc(e.title)}</h3>${v ? `<span class="tag ok" style="margin-left:auto">Validé</span>` : ""}</div>
      <p class="meta">${esc(e.tool)}, environ ${esc(e.time)}</p>
      <p>${esc(e.brief)}</p>
      ${EX_TOOLS[e.id] ? `<p class="toolsline" style="margin-top:-4px">Avant de commencer, la fiche outil : ${toolLinks(EX_TOOLS[e.id])}</p>` : ""}
      <fieldset style="border:0;padding:0;margin:0" class="crit"><legend class="small muted">Critères</legend>
        ${e.criteria.map((c, i) => `<label><input type="checkbox" data-crit="${e.id}" data-i="${i}" ${s.criteria[i] ? "checked" : ""} ${v ? "disabled" : ""}><span>${esc(c)}</span></label>`).join("")}</fieldset>
      <label for="p-${e.id}" class="small muted" style="display:block;margin:10px 0 4px">Preuve : ${esc(e.proof.toLowerCase())}</label>
      <input type="text" id="p-${e.id}" class="field" data-proof="${e.id}" value="${esc(s.proof || "")}" placeholder="https://…" ${v ? "disabled" : ""}>
      <p class="err" id="err-${e.id}"></p>
      <div class="row">${v ? `<span class="small muted">Validé le ${new Date(s.validatedAt).toLocaleDateString("fr-FR")}</span><button class="btn link" data-act="ex-reopen" data-id="${e.id}">Rouvrir</button>` : `<button class="btn main" data-act="ex-validate" data-id="${e.id}" data-m="${m.id}">Valider l’exercice</button>`}</div>
    </article>`;
  }).join("") + (validatedCount(m) === m.exercises.length ? `<p><a class="btn main" href="#${m.slug}-carnet">Écrire la rétro de l’étape</a></p>` : "");
}

function viewNotebook(m) {
  const n = state.notes[m.id] || {};
  const qs = [["got", "Ce que j’ai compris", "Une idée qui a changé votre façon de voir le sujet."], ["stuck", "Ce qui m’a bloqué", "Où avez-vous perdu du temps, et pourquoi ?"], ["change", "Ce que je change pour la suite", "Une seule décision concrète pour l’étape suivante."]];
  return `<section class="block"><h2>Carnet : ${esc(m.title)}</h2>
    <p class="muted">Personne ne relit ce carnet à votre place. Trois réponses courtes suffisent ; elles serviront de matière pour l’entretien.</p>
    ${qs.map(([k, label, hint]) => `<h3><label for="n-${k}">${label}</label></h3><p class="small muted" id="hint-${k}">${hint}</p><textarea class="field" id="n-${k}" data-note="${m.id}" data-k="${k}" aria-describedby="hint-${k}">${esc(n[k] || "")}</textarea>`).join("")}
    <p class="small muted" style="margin-top:12px" id="notestatus" aria-live="polite">${noteDone(m) ? "Carnet complet, enregistré." : "Enregistré automatiquement."}</p>
    ${m.id < 5 && isDone(m) ? `<p><a class="btn main" href="#module-${m.id + 1}">Étape suivante</a></p>` : ""}</section>`;
}

function render() {
  const r = parse();
  renderChrono(); renderTrail(r);
  let html;
  if (r.view === "accueil") html = viewHome();
  else if (r.view === "outils") html = viewTools();
  else if (r.view === "outil") html = viewTool(r.tool);
  else if (!isUnlocked(r.m)) html = lockedView(r.m);
  else html = { apercu: viewOverview, fiches: viewLessons, quiz: viewQuiz, exercices: viewExercises, carnet: viewNotebook }[r.view](r.m);
  document.getElementById("main").innerHTML = html;
  document.title = (r.m ? r.m.title : r.tool ? r.tool.name : r.view === "outils" ? "Boîte à outils" : "Tableau de bord") + " · Builder Path";
}
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); }
function go(href) { if (location.hash === href) render(); else location.hash = href; }

/* ---------- Interactions ---------- */
function startSession() { const r = parse(); state.session = { start: new Date().toISOString(), module: r.m ? r.m.id : null }; persist(); toast("Séance démarrée"); }
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act], a[data-lesson]"); if (!b) return;
  if (b.dataset.lesson) { const [mid, i] = b.dataset.lesson.split(":").map(Number); state.ui.lesson[mid] = i; persist(false); }
  const act = b.dataset.act, m = b.dataset.m ? MODULES[Number(b.dataset.m) - 1] : null;
  switch (act) {
    case "start": startSession(); render(); break;
    case "start-go": startSession(); go(b.dataset.href); break;
    case "stop": {
      const min = Math.min(240, elapsed()), mod = state.session.module;
      if (min >= 1) { state.sessions.push({ start: state.session.start, min, module: mod || (parse().m || {}).id || null }); toast("Séance enregistrée : " + fmtMin(min)); }
      else toast("Séance de moins d’une minute, non comptée");
      state.session = null; persist(); render(); break;
    }
    case "unlock": state.unlocked[m.id] = true; persist(); render(); break;
    case "lesson-prev": state.ui.lesson[m.id] = Math.max(0, (state.ui.lesson[m.id] ?? 0) - 1); persist(false); render(); window.scrollTo({ top: 0 }); break;
    case "lesson-next": {
      const i = Number(b.dataset.i); state.lessons[m.lessons[i].id] = true;
      if (i === m.lessons.length - 1) { persist(); go("#" + m.slug + "-quiz"); }
      else { state.ui.lesson[m.id] = i + 1; persist(); render(); window.scrollTo({ top: 0 }); document.getElementById("h-lesson").focus?.(); }
      break;
    }
    case "lesson-unread": state.lessons[b.dataset.id] = false; persist(); render(); break;
    case "q-start": state.quiz[m.id] = Object.assign({}, state.quiz[m.id], { run: { i: 0, answers: [], checked: false } }); persist(false); render(); window.scrollTo({ top: 0 }); break;
    case "q-check": {
      const run = state.quiz[m.id].run;
      if (run.answers[run.i] == null) { document.getElementById("qerr").textContent = "Choisissez une réponse avant de vérifier."; document.querySelector('input[name="answer"]').focus(); break; }
      run.checked = true; persist(false); render(); break;
    }
    case "q-next": {
      const q = state.quiz[m.id], run = q.run;
      if (run.i < m.quiz.length - 1) { run.i++; run.checked = false; persist(false); render(); break; }
      const ok = m.quiz.filter((it, i) => run.answers[i] === it.ok).length, score = Math.round(ok / m.quiz.length * 100);
      q.attempts = (q.attempts || 0) + 1; if (q.first == null) q.first = score;
      q.best = Math.max(q.best || 0, score); q.lastAnswers = run.answers; q.run = null;
      persist(); render(); window.scrollTo({ top: 0 });
      toast(score >= PASS ? "Quiz réussi : " + score + " %" : "Score : " + score + " %");
      break;
    }
    case "q-quit": state.quiz[m.id].run = null; persist(false); render(); break;
    case "ex-validate": {
      const e = m.exercises.find(x => x.id === b.dataset.id), s = exState(e), err = document.getElementById("err-" + e.id);
      if (!e.criteria.every((_, i) => s.criteria[i])) { err.textContent = "Cochez tous les critères avant de valider."; break; }
      if (!(s.proof || "").trim()) { err.textContent = "Ajoutez une preuve : un lien ou une description courte."; document.getElementById("p-" + e.id).focus(); break; }
      s.status = "validated"; s.validatedAt = new Date().toISOString(); persist(); render(); toast("Exercice validé"); break;
    }
    case "ex-reopen": { if (confirm("Rouvrir cet exercice ? Il ne comptera plus comme validé.")) { state.exercises[b.dataset.id].status = "todo"; persist(); render(); } break; }
    case "export": {
      const txt = JSON.stringify(state, null, 2);
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Progression copiée"), () => prompt("Copiez votre progression :", txt));
      break;
    }
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.name === "answer") { const r = parse(); const run = state.quiz[r.m.id].run; if (!run.checked) { run.answers[run.i] = Number(t.value); document.getElementById("qerr").textContent = ""; persist(false); } }
  if (t.dataset.crit) { exState({ id: t.dataset.crit }).criteria[Number(t.dataset.i)] = t.checked; persist(); }
  if (t.id === "goal") { state.goalH = Number(t.value); persist(false); render(); }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.proof) { exState({ id: t.dataset.proof }).proof = t.value; document.getElementById("err-" + t.dataset.proof).textContent = ""; persist(); }
  if (t.dataset.note) {
    const id = Number(t.dataset.note); (state.notes[id] = state.notes[id] || {})[t.dataset.k] = t.value; persist();
    document.getElementById("notestatus").textContent = noteDone(MODULES[id - 1]) ? "Carnet complet, enregistré." : "Enregistré automatiquement.";
  }
});
window.addEventListener("hashchange", () => { render(); window.scrollTo({ top: 0 }); document.getElementById("main").focus({ preventScroll: true }); });
setInterval(() => { const el = document.getElementById("elapsed"); if (el && state.session) el.textContent = fmtMin(elapsed()); }, 15000);

loadLocal();
render();
connectDb();
</script>
</body>
</html>
